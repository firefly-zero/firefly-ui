[package]
name = "firefly-ui"
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["Firefly Zero team"]
description = "UI helpers and components for Firefly Zero system apps"
repository = "https://github.com/firefly-zero/firefly-ui"
license = "MIT"
keywords = ["gamedev", "firefly-zero"]
categories = ["game-development", "no-std", "rendering", "wasm"]

[dependencies]
firefly-rust = "0.13.2"

[dev-dependencies]
firefly-rust = { version = "0.13.2", features = ["talc"] }

[patch.crates-io]
firefly-rust = { path = "../firefly-rust" }
